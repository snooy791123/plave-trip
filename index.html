/* ═══ RENDER LOGIC ═══ */
function buildMapUrl(q) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`; }
const mainEl = document.getElementById('mainEl');
const navInner = document.getElementById('navInner');

DAYS.forEach((day, index) => {
  const color = DAY_COLORS['day'+(index+1)] || 'var(--primary)';
  
  // Nav Render
  const navA = document.createElement('a');
  navA.className = 'nav-item' + (index === 0 ? ' active' : '');
  navA.href = '#' + day.id;
  navA.dataset.day = day.id;
  navA.innerHTML = `<span class="day-dot" style="background:${color}"></span>${day.title}`;
  navInner.appendChild(navA);

  // Timeline Render
  let timelineHTML = '';
  if(day.itinerary && day.itinerary.length > 0) {
    timelineHTML = `
      <div class="timeline-wrap">
        <div class="timeline-bg"></div>
        <div class="timeline-header"><i class="fas fa-route" style="color:${color}"></i> 行程規劃</div>
        <div class="timeline-list">
          ${day.itinerary.map(it => `
            <div class="timeline-item">
              <div class="timeline-icon" style="color:${color}">${it.icon}</div>
              <div class="timeline-content">
                <div class="timeline-time">${it.time}</div>
                <div class="timeline-text">${it.text}</div>
                ${it.map ? `<a href="${buildMapUrl(it.map)}" target="_blank" class="timeline-map-btn"><i class="fas fa-map-pin" style="color:${color}"></i> 導航</a>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Cards Render
  const cardsHTML = (day.places || []).map(p => `
    <div class="card" style="--tape-color:${p.tape};--tape-angle:${p.angle}">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-area" style="color:${color}"><i class="fas fa-map-marker-alt"></i>${p.area}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-type">${p.type}</div>
        </div>
        <div class="card-score">${p.rating}<span class="s"><i class="fas fa-star"></i></span></div>
      </div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-recommend" style="--rc-color:${color}">
        <div class="rc-title">推薦必點</div>
        <div>${p.recommend}</div>
      </div>
      <div style="margin-top:auto">
        <a href="${buildMapUrl(p.name + ' ' + p.area)}" target="_blank" class="btn-map"><i class="fas fa-location-dot"></i> 開啟地圖導航</a>
      </div>
    </div>`).join('');

  const sec = document.createElement('section');
  sec.id = day.id;
  sec.className = 'day-section';
  sec.innerHTML = `
    <div class="day-header">
      <div class="day-badge" style="background:${color}">
        <div class="dn">${day.num}</div><div class="dl">DAY</div>
      </div>
      <div class="day-meta">
        <div class="day-title" style="color:${color}">${day.date}　${day.title}</div>
        <div class="day-subtitle">${day.subtitle}</div>
      </div>
    </div>
    ${timelineHTML}
    ${day.places && day.places.length > 0 ? `<h3 style="font-family:var(--f-display); font-weight:900; margin-bottom: 20px; font-size: 1.1rem; color:var(--ink); display:flex; align-items:center; gap:8px;"><i class="fas fa-utensils" style="color:${color}; font-size:0.9em;"></i> 周邊美食推薦 (${day.places.length}選)</h3><div class="restaurant-grid">${cardsHTML}</div>` : ''}
  `;
  mainEl.appendChild(sec);
});

/* ═══ INTERACTION LOGIC ═══ */
const animateObs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); animateObs.unobserve(e.target); } }); }, { threshold: 0.05, rootMargin: '0px 0px -50px 0px' });
document.querySelectorAll('.timeline-item, .card').forEach(el => animateObs.observe(el));

const navItems = document.querySelectorAll('.nav-item');
navItems.forEach(item => { item.addEventListener('click', function(e) { e.preventDefault(); const dayId = this.dataset.day; navItems.forEach(n => n.classList.remove('active')); this.classList.add('active'); const sec = document.getElementById(dayId); const navH = document.querySelector('.nav-wrap').offsetHeight; const y = sec.getBoundingClientRect().top + window.scrollY - navH - 12; window.scrollTo({ top: y, behavior: 'smooth' }); }); });

const secObs = new IntersectionObserver(entries => { entries.forEach(e => { if (!e.isIntersecting) return; navItems.forEach(n => n.classList.remove('active')); const match = document.querySelector(`.nav-item[data-day="${e.target.id}"]`); if (match) match.classList.add('active'); }); }, { threshold: 0, rootMargin: '-60px 0px -75% 0px' });
document.querySelectorAll('.day-section').forEach(s => secObs.observe(s));

const btt = document.getElementById('btt');
window.addEventListener('scroll', () => btt.classList.toggle('show', window.scrollY > 500), { passive: true });
</script>
